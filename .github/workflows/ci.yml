name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    # macOS runs the same smoke tests against the BSD userland (sed, awk, mktemp) users have.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck helper scripts
        # ubuntu-latest ships shellcheck preinstalled. Gate on warning+ only:
        # info-level notes (e.g. SC2015 guard-clause style) vary by shellcheck
        # version and are not bugs here, so they must not make CI nondeterministic.
        # Static analysis is OS-independent, so one run (Linux) is enough.
        # globstar so bench/**/*.sh reaches the task checks and seed scripts at any depth, and
        # skills/genesis/templates/**/*.sh the eval runner and guard genesis copies.
        if: runner.os == 'Linux'
        run: |
          shopt -s globstar
          shellcheck --severity=warning scripts/*.sh scripts/test/*.sh bench/**/*.sh \
            skills/genesis/templates/**/*.sh
      - name: Helper script smoke tests
        run: bash scripts/test/smoke.sh
      - name: Genesis eval template tests
        # Offline: run.sh against pass, fail, skip, and exit-2 fixture evals; guard.sh against
        # throwaway git repos; run.sh --evidence/--judge and judge.sh against a fake curl, so
        # no model is ever called.
        run: bash scripts/test/evals.sh
      - name: Autopilot ledger helper tests
        # Offline: the evals metric read, the convergence decision, and the next-milestone gate
        # against a stub gh.
        run: bash scripts/test/autopilot.sh
      - name: Genesis next-milestone helper tests
        # Offline: milestone numbering and the milestone diff check against throwaway git repos.
        run: bash scripts/test/genesis-next.sh
      - name: VISION.md guard tests
        # Offline: auto's VISION.md check (only the Roadmap body changes) against throwaway repos.
        run: bash scripts/test/vision.sh
      - name: After-merge helper tests
        # Offline: closing the merged PR's issue and a finished epic, against a stub gh that
        # serves REST and refuses GraphQL and porcelain, as a Claude Code cloud session does.
        run: bash scripts/test/after-merge.sh
      - name: REST issue, label, and pull request helper tests
        # Offline: the sub-issue link, label creation, open-issue text match, ledger read, and the
        # issues a PR's body closes, plus the cookbook's REST recipes, against a stub gh that
        # serves REST and refuses GraphQL and porcelain.
        run: bash scripts/test/rest.sh
      - name: Merge gate helper tests
        # Offline: auto's merge state, checks wait, and merge with its branch delete, against a
        # stub gh that serves REST and refuses GraphQL and porcelain.
        run: bash scripts/test/merge-gate.sh
      - name: Cloud session tests
        # Offline: the Projects v2 board steps skip on the cloud proxy's GraphQL 403 (and fail as
        # before on any other error), and the bench preflight reads an empty scopes header as
        # unknown, against a stub gh.
        run: bash scripts/test/cloud.sh
      - name: Benchmark task validation
        # Offline: each task's hidden check must fail on its seed and pass with its reference patch.
        run: bash bench/validate.sh
      - name: Benchmark validator self-test
        run: bash bench/test/selftest.sh
